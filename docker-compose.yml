# PostgreSQL para desenvolvimento e testes. Não use estas credenciais em produção.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: inscreve
      POSTGRES_PASSWORD: inscreve
      POSTGRES_DB: inscreve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inscreve -d inscreve"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
